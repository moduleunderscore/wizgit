<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="512" height="512">
<style>.wl{fill:none;stroke:#00FF85;stroke-linecap:round;stroke-linejoin:round}.wg{stroke-width:9;stroke-opacity:.09}.wm{stroke-width:2.5;stroke-opacity:.65}.ws{stroke-width:2;stroke-opacity:.50}.wt{stroke-width:1.2;stroke-opacity:.32}.n1{fill:#00FF85;fill-opacity:.14}.n2{fill:#00FF85;fill-opacity:.86}.n3{fill:#00FF85;fill-opacity:.72}</style>

<!-- Blue ocean frontier — barely visible outer boundary -->
<circle fill="none" stroke="#00FF85" stroke-width="9" stroke-opacity=".05" cx="50" cy="50" r="44"/>
<circle fill="none" stroke="#00FF85" stroke-width="1" stroke-opacity=".14" cx="50" cy="50" r="44"/>

<!-- 7 radial spokes — glow layer (center to outer tips) -->
<line class="wl wg" x1="50" y1="50" x2="50" y2="10"/>
<line class="wl wg" x1="50" y1="50" x2="81" y2="25"/>
<line class="wl wg" x1="50" y1="50" x2="89" y2="59"/>
<line class="wl wg" x1="50" y1="50" x2="67" y2="86"/>
<line class="wl wg" x1="50" y1="50" x2="33" y2="86"/>
<line class="wl wg" x1="50" y1="50" x2="11" y2="59"/>
<line class="wl wg" x1="50" y1="50" x2="19" y2="25"/>

<!-- Convergence ring — conventional boundary -->
<circle fill="none" stroke="#00FF85" stroke-width="9" stroke-opacity=".09" cx="50" cy="50" r="33"/>
<circle class="wl wm" cx="50" cy="50" r="33"/>

<!-- 7 radial spokes — main layer -->
<line class="wl wm" x1="50" y1="50" x2="50" y2="10"/>
<line class="wl wm" x1="50" y1="50" x2="81" y2="25"/>
<line class="wl wm" x1="50" y1="50" x2="89" y2="59"/>
<line class="wl wm" x1="50" y1="50" x2="67" y2="86"/>
<line class="wl wm" x1="50" y1="50" x2="33" y2="86"/>
<line class="wl wm" x1="50" y1="50" x2="11" y2="59"/>
<line class="wl wm" x1="50" y1="50" x2="19" y2="25"/>

<!-- Inner synthesis ring -->
<circle class="wl wt" cx="50" cy="50" r="13"/>

<!-- 5 GURU nodes (k=0,1,2,5,6) — larger -->
<circle class="n1" cx="50" cy="24" r="8"/><circle class="n2" cx="50" cy="24" r="5"/>
<circle class="n1" cx="70" cy="34" r="8"/><circle class="n2" cx="70" cy="34" r="5"/>
<circle class="n1" cx="75" cy="56" r="8"/><circle class="n2" cx="75" cy="56" r="5"/>
<circle class="n1" cx="25" cy="56" r="8"/><circle class="n2" cx="25" cy="56" r="5"/>
<circle class="n1" cx="30" cy="34" r="8"/><circle class="n2" cx="30" cy="34" r="5"/>

<!-- 2 LLM nodes (k=3,4) — smaller -->
<circle class="n1" cx="61" cy="73" r="5.5"/><circle class="n3" cx="61" cy="73" r="3.2"/>
<circle class="n1" cx="39" cy="73" r="5.5"/><circle class="n3" cx="39" cy="73" r="3.2"/>

<!-- Edge tip nodes at r=40 — beyond the boundary -->
<circle class="n1" cx="50" cy="10" r="4.5"/><circle class="n3" cx="50" cy="10" r="2.5"/>
<circle class="n1" cx="81" cy="25" r="4.5"/><circle class="n3" cx="81" cy="25" r="2.5"/>
<circle class="n1" cx="89" cy="59" r="4.5"/><circle class="n3" cx="89" cy="59" r="2.5"/>
<circle class="n1" cx="67" cy="86" r="4.5"/><circle class="n3" cx="67" cy="86" r="2.5"/>
<circle class="n1" cx="33" cy="86" r="4.5"/><circle class="n3" cx="33" cy="86" r="2.5"/>
<circle class="n1" cx="11" cy="59" r="4.5"/><circle class="n3" cx="11" cy="59" r="2.5"/>
<circle class="n1" cx="19" cy="25" r="4.5"/><circle class="n3" cx="19" cy="25" r="2.5"/>

<!-- CENTER — ULTRA synthesis node (largest in the system) -->
<circle class="n1" cx="50" cy="50" r="13"/>
<circle fill="#00FF85" fill-opacity=".86" cx="50" cy="50" r="7.5"/>
<circle fill="#00FF85" fill-opacity=".96" cx="50" cy="50" r="4"/>

</svg>
